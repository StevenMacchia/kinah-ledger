<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Kinah Ledger: a gold K struck into a night tile, over the aether ledger rule. For 32px and up; logo-small.svg is the 16 to 24px cut. -->
  <defs>
    <linearGradient id="kl-tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#252C5C"/><stop offset=".6" stop-color="#131834"/><stop offset="1" stop-color="#0A0D1D"/></linearGradient>
    <radialGradient id="kl-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#EBAE4C" stop-opacity=".26"/><stop offset="1" stop-color="#EBAE4C" stop-opacity="0"/></radialGradient>
    <linearGradient id="kl-edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".35" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity=".03"/></linearGradient>
    <linearGradient id="kl-gold" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="71"><stop offset="0" stop-color="#FFEDC4"/><stop offset=".42" stop-color="#F4C46A"/><stop offset="1" stop-color="#D38C27"/></linearGradient>
    <linearGradient id="kl-depth" gradientUnits="userSpaceOnUse" x1="0" y1="22" x2="0" y2="71"><stop offset="0" stop-color="#B9781F"/><stop offset="1" stop-color="#7A4C10"/></linearGradient>
    <linearGradient id="kl-rule" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="72" y2="0"><stop offset="0" stop-color="#7EE6DA"/><stop offset="1" stop-color="#3FB4C6"/></linearGradient>
    <filter id="kl-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity=".5"/></filter>
  </defs>
  <rect x="2" y="2" width="96" height="96" rx="23" fill="url(#kl-tile)"/>
  <circle cx="51" cy="50" r="40" fill="url(#kl-glow)"/>
  <rect x="2.8" y="2.8" width="94.4" height="94.4" rx="22.2" fill="none" stroke="url(#kl-edge)" stroke-width="1.6"/>
  <g filter="url(#kl-shadow)">
    <path d="M30 22H42.5V71H30ZM42.5 45.03L57.5 22H72L42.5 67.29ZM52.53 51.89L72 71H57L42.5 56.77Z" fill="url(#kl-depth)" transform="translate(1.7 2)"/>
    <path d="M30 22H42.5V71H30ZM42.5 45.03L57.5 22H72L42.5 67.29ZM52.53 51.89L72 71H57L42.5 56.77Z" fill="url(#kl-gold)"/>
  </g>
  <rect x="30" y="79" width="42" height="5.5" rx="2.75" fill="url(#kl-rule)"/>
</svg>
