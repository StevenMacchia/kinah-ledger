name: screen probe
on: workflow_dispatch
jobs:
  p:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class Disp {
            [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
              public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra; public int dmFields;
              public int dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
              public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
              public short dmLogPixels; public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
              public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
            }
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] public static extern bool EnumDisplaySettings(string dev, int mode, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet = CharSet.Ansi)] public static extern int ChangeDisplaySettings(ref DEVMODE dm, int flags);
          }
          '@
          $n = 0; $seen = @{}
          for ($i = 0; $i -lt 400; $i++) {
            $dm = New-Object Disp+DEVMODE; $dm.dmSize = [int][Runtime.InteropServices.Marshal]::SizeOf($dm)
            if (-not [Disp]::EnumDisplaySettings($null, $i, [ref]$dm)) { "stop at $i size $($dm.dmSize)"; break }
            $seen["$($dm.dmPelsWidth)x$($dm.dmPelsHeight)x$($dm.dmBitsPerPel)"] = 1
          }
          $seen.Keys | Sort-Object
          Get-CimInstance Win32_VideoController | Format-List Name, VideoModeDescription, CurrentHorizontalResolution, CurrentVerticalResolution, DriverVersion
