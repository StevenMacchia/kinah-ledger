name: screen probe
on:
  push:
    branches: [ci/fonts-diagnostic]
    paths: [".github/workflows/screen-probe.yml"]
jobs:
  p:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System; using System.Runtime.InteropServices;
          public static class Disp {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern bool EnumDisplaySettingsW(string dev, int mode, IntPtr dm);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int ChangeDisplaySettingsW(IntPtr dm, int flags);
          }
          '@
          # a raw DEVMODEW (220 bytes): dmSize at 68, dmFields at 72, dmBitsPerPel 168, dmPelsWidth 172, dmPelsHeight 176
          $M = [Runtime.InteropServices.Marshal]
          $buf = $M::AllocHGlobal(220); $best = $null; $bw = 0
          for ($i = 0; $i -lt 500; $i++) {
            $M::Copy([byte[]]::new(220), 0, $buf, 220); $M::WriteInt16($buf, 68, 220)
            if (-not [Disp]::EnumDisplaySettingsW($null, $i, $buf)) { break }
            $w = $M::ReadInt32($buf, 172); $h = $M::ReadInt32($buf, 176)
            if ($M::ReadInt32($buf, 168) -ge 32 -and $w -le 1920 -and $h -le 1080 -and $w -gt $bw) { $bw = $w; $best = New-Object byte[] 220; $M::Copy($buf, $best, 0, 220) }
          }
          "modes read: $i"
          if ($null -eq $best) { "no mode found"; exit 0 }
          $M::Copy($best, 0, $buf, 220)
          "setting $($M::ReadInt32($buf, 172))x$($M::ReadInt32($buf, 176))"
          "ChangeDisplaySettingsW -> $([Disp]::ChangeDisplaySettingsW($buf, 0)) (0 = done)"
          Start-Sleep 2
          Add-Type -AssemblyName System.Windows.Forms
          "screen now: " + [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
