name: screen probe
on:
  push:
    branches: [ci/fonts-diagnostic]
    paths: [".github/workflows/screen-probe.yml", "tools/probe-odo.ps1"]
jobs:
  p:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: powershell -ExecutionPolicy Bypass -File tools/probe-odo.ps1
