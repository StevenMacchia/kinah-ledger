# Builds KinahLedger.exe on Windows whenever main changes (or on demand from the Actions tab), so the latest
# build is always one download away: open the run, then Artifacts › kinah-ledger-tracker. The artifact holds the
# self-contained exe and its latest.json (version, size, SHA-256). Publishing a release stays a manual step.
name: Build tracker

on:
  push:
    branches: [main]
    paths:
      - 'tracker/**'
      - 'data/**'
      - 'tools/release-manifest.js'
      - 'tools/data/**'
      - '.github/workflows/build-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # trackers download game data by this manifest's checksums: a data change committed without it would never reach them
      - name: Check data/manifest.json is current
        run: node tools/data/manifest.js --check

      # crowd-learned aliases ship with the game data: every one an item, none of them rare, none an item's own name
      - name: Check data/aliases.json
        run: node tools/data/aliases.js --check

      - name: Publish the single-file exe
        working-directory: tracker/KinahLedger.Tracker
        run: dotnet publish -c Release -o ../../dist

      # the self-tests that need no game window (parse, market, accuracy) and the replay test bank the release workflow also runs
      - name: Accuracy self-test and replay tests
        shell: bash
        run: |
          dist/KinahLedger.exe parse-test | cat
          dist/KinahLedger.exe market-test | cat
          dist/KinahLedger.exe accuracy-test | cat
          dist/KinahLedger.exe replay-bank tracker/tests/replays | cat

      - name: Write latest.json
        run: node tools/release-manifest.js dist/KinahLedger.exe

      - uses: actions/upload-artifact@v4
        with:
          name: kinah-ledger-tracker
          path: |
            dist/KinahLedger.exe
            dist/latest.json
          if-no-files-found: error
          retention-days: 30
