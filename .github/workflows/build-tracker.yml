# Builds KinahLedger.exe on Windows whenever main changes (or on demand from the Actions tab), so the latest
# build is always one download away: open the run, then Artifacts › kinah-ledger-tracker. The artifact holds the
# self-contained exe and its latest.json (version, size, SHA-256). Publishing a release stays a manual step.
name: Build tracker

on:
  push:
    branches: [main]
    paths:
      - 'tracker/**'
      - 'data/**'
      - 'tools/release-manifest.js'
      - 'tools/data/**'
      - '.github/workflows/build-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # trackers download game data by this manifest's checksums: a data change committed without it would never reach them
      - name: Check data/manifest.json is current
        run: node tools/data/manifest.js --check

      - name: Publish the single-file exe
        working-directory: tracker/KinahLedger.Tracker
        run: dotnet publish -c Release -o ../../dist

      # the self-tests that need no game, on GitHub's machine rather than a player's PC (Steven, 2026-10-23)
      - name: Self-tests (parse, market, options)
        shell: bash
        run: |
          dist/KinahLedger.exe parse-test | tail -25
          dist/KinahLedger.exe market-test | tail -45
          dist/KinahLedger.exe options-test | tail -15

      # the window and its cards drawn with sample data, kept as an artifact for layout review
      - name: Layout renders
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p shots
          dist/KinahLedger.exe ui-shot shots --demo --compact
          dist/KinahLedger.exe ui-shot shots --demo --full
          dist/KinahLedger.exe ui-shot shots --demo --crafting
          dist/KinahLedger.exe ui-shot shots --options

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layout-renders
          path: shots/*.png
          if-no-files-found: ignore

      - name: Write latest.json
        run: node tools/release-manifest.js dist/KinahLedger.exe

      - uses: actions/upload-artifact@v4
        with:
          name: kinah-ledger-tracker
          path: |
            dist/KinahLedger.exe
            dist/latest.json
          if-no-files-found: error
          retention-days: 30
