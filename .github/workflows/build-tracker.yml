# Builds KinahLedger.exe on Windows whenever main changes (or on demand from the Actions tab), so the latest
# build is always one download away: open the run, then Artifacts › kinah-ledger-tracker. The artifact holds the
# self-contained exe and its latest.json (version, size, SHA-256). Publishing a release stays a manual step.
name: Build tracker

on:
  push:
    branches: [main]
    paths:
      - 'tracker/**'
      - 'data/**'
      - 'tools/release-manifest.js'
      - 'tools/data/**'
      - '.github/workflows/build-tracker.yml'
  workflow_dispatch:

permissions:
  contents: read

# A run started by hand on a branch (how sessions test their work) never fails the run itself, so Steven isn't
# emailed for every try: each check still runs, and the last step writes "RESULT: PASS" or "RESULT: FAIL" with the
# failed checks to the run summary and log (read it with `gh run view <id> --log | grep "RESULT:"`). On main, and in
# the release workflow, a failed check fails the run as before.

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # trackers download game data by this manifest's checksums: a data change committed without it would never reach them
      - name: Check data/manifest.json is current
        id: manifest
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: node tools/data/manifest.js --check

      # crowd-learned aliases ship with the game data: every one an item, none of them rare, none an item's own name
      - name: Check data/aliases.json
        id: aliases
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: node tools/data/aliases.js --check

      - name: Publish the single-file exe
        id: publish
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        working-directory: tracker/KinahLedger.Tracker
        run: dotnet publish -c Release -o ../../dist

      # the name decoder's model (Ocr/NameDecoder.cs), from the pinned URLs in data/models.json, checked by SHA-256 (about
      # 7.7 MB, a second or two). parse-test then runs the model on its drawn crops; if the download fails the tests run the
      # tracker's path without a model ("decoder off") and still pass, so this step never fails the run
      - name: Fetch the name decoder's model
        continue-on-error: true
        timeout-minutes: 2
        run: node tools/data/models.js --out data/models

      # the self-tests that need no game window (parse, market, accuracy) and the replay test bank the release workflow also runs
      - name: Accuracy self-test and replay tests
        id: tests
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        shell: bash
        run: |
          dist/KinahLedger.exe parse-test | cat
          dist/KinahLedger.exe market-test | cat
          dist/KinahLedger.exe accuracy-test | cat
          dist/KinahLedger.exe replay-bank tracker/tests/replays | cat
          dist/KinahLedger.exe options-test | cat

      # Options and the window in a demo (player features), and the window and its cards drawn for layout review
      - name: options-test
        id: options
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        shell: bash
        run: dist/KinahLedger.exe options-test | cat

      - name: Layout renders
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p shots
          dist/KinahLedger.exe ui-shot shots --demo --compact
          dist/KinahLedger.exe ui-shot shots --demo --full
          # Full view on a narrow screen (KL_SCREEN_W, in DIPs): 1080p at 150% (1280) draws both columns scaled down to fit;
          # 960 (1920 at 200%) is too narrow even scaled, so the window shows Compact with its one-line note
          KL_SCREEN_W=1280 dist/KinahLedger.exe ui-shot shots/narrow-1280 --demo --full
          KL_SCREEN_W=960 dist/KinahLedger.exe ui-shot shots/narrow-960 --demo --full
          # the Undo bar (KL_SHOT_UNDO), as it shows just after Clear the tables, at both widths and in Daylight
          KL_SHOT_UNDO=1 dist/KinahLedger.exe ui-shot shots/undo --demo --compact
          KL_SHOT_UNDO=1 dist/KinahLedger.exe ui-shot shots/undo --demo --full
          KL_SHOT_UNDO=1 dist/KinahLedger.exe ui-shot shots/undo --demo --compact --skin daylight
          dist/KinahLedger.exe ui-shot shots --demo --crafting
          dist/KinahLedger.exe ui-shot shots --options
          # the whole Farming view at both widths (however tall), the Events part with its Runs card alone (folded and
          # with Materials open), and the Crafting part before anything is crafted
          # (each --demo farming render also writes ui-accuracy-card.png, the Accuracy card open on its things to check,
          # and ui-hud-accuracy.png, the panel with its accuracy line)
          dist/KinahLedger.exe ui-shot shots --demo --compact --tall
          dist/KinahLedger.exe ui-shot shots --demo --full --tall
          dist/KinahLedger.exe ui-shot shots --demo --events
          dist/KinahLedger.exe ui-shot shots --demo --crafting --empty
          # a recipe with its upgrades as rows under it (2026-10-26): ui-main-crafting-upgrades.png
          dist/KinahLedger.exe ui-shot shots --demo --crafting --upgrades
          # the Live UI (0.8.30, direction C): the Farming feed at both widths comes from the renders above (with
          # ui-line-report.png, a tapped line's report sheet, and the panel's farming and flagged states, ui-hud-farming.png
          # and ui-hud-flag.png); the Events render opens the merged record's fix sheet (ui-main-events.png and
          # ui-runs-card-fix.png); the Crafting render draws the crafting feed and ui-hud-crafting.png; a gathering stretch's feed
          dist/KinahLedger.exe ui-shot shots --demo --gathering --compact --tall
          # Daylight (0.8.31): the main views again in the light look, in their own folder so the card renders don't
          # overwrite the Night ones (Steven, 2026-10-24: the Events page "awful, especially in light mode")
          mkdir -p shots/daylight
          dist/KinahLedger.exe ui-shot shots/daylight --demo --compact --tall --skin daylight
          dist/KinahLedger.exe ui-shot shots/daylight --demo --events --skin daylight
          dist/KinahLedger.exe ui-shot shots/daylight --demo --events --tall --skin daylight
          dist/KinahLedger.exe ui-shot shots --demo --events --tall
          dist/KinahLedger.exe ui-shot shots/daylight --demo --crafting --skin daylight
          dist/KinahLedger.exe ui-shot shots/daylight --options --skin daylight

      - uses: actions/upload-artifact@v4
        if: always() && steps.publish.outcome == 'success'
        with:
          name: layout-renders
          path: shots/**/*.png
          if-no-files-found: ignore

      - name: Write latest.json
        id: latest
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: node tools/release-manifest.js dist/KinahLedger.exe

      - uses: actions/upload-artifact@v4
        if: steps.publish.outcome == 'success'
        with:
          name: kinah-ledger-tracker
          path: |
            dist/KinahLedger.exe
            dist/latest.json
          if-no-files-found: error
          retention-days: 30

      # one line that says how the checks went, for branch runs that never fail on their own
      - name: Result
        if: always()
        shell: bash
        run: |
          failed=""
          for s in "manifest:${{ steps.manifest.outcome }}" "aliases:${{ steps.aliases.outcome }}" "publish:${{ steps.publish.outcome }}" "tests:${{ steps.tests.outcome }}" "options:${{ steps.options.outcome }}" "latest:${{ steps.latest.outcome }}"; do
            [ "${s#*:}" = "failure" ] && failed="$failed ${s%%:*}"
          done
          if [ -n "$failed" ]; then r="RESULT: FAIL ($failed )"; else r="RESULT: PASS"; fi
          echo "$r"; echo "## $r" >> "$GITHUB_STEP_SUMMARY"
