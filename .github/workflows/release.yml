# Releases the tracker: push a tag vX.Y.Z and this builds, on a GitHub-hosted runner,
#  - the installer (0.8+): Velopack packs the app as normal files into KinahLedger-Setup.exe plus the full and delta
#    update packages and releases.win.json, which installed trackers update from (Platform/Installer.cs);
#  - KinahLedger.exe, the single-file exe every 0.7 copy updates from, which offers to install itself;
# signs both with Microsoft's Artifact Signing (formerly Trusted Signing) once the repository has the variables below,
# writes latest.json and publishes the GitHub release. Nothing else builds or signs a release (CODE_SIGNING_POLICY.md).
#
# Before tagging: bump <Version> in the csproj to X.Y.Z and add release-notes/vX.Y.Z.md. The run stops if either is
# missing, so a stray tag never reaches players. It also stops when the installer or its update packages are missing:
# installed trackers update only from releases that carry them (docs/signing-setup.md, Platform/Installer.cs).
#
# Signing turns on when the "release" environment has these variables (Settings > Environments > release):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID   the app registration GitHub signs in as (OpenID Connect,
#                                                            no secret stored here)
#   AZURE_SIGNING_ENDPOINT       e.g. https://eus.codesigning.azure.net
#   AZURE_SIGNING_ACCOUNT        the Artifact Signing account name
#   AZURE_SIGNING_PROFILE        its certificate profile name
name: Release tracker

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read
  id-token: write   # Azure sign-in for Artifact Signing (OpenID Connect)

jobs:
  release:
    runs-on: windows-latest
    # the "release" environment holds the Azure variables, and is what Azure trusts for signing (docs/signing-setup.md)
    environment: release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check the tag, the version and the notes agree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"; ver="${tag#v}"
          csproj=$(grep -oP '(?<=<Version>)[^<]+' tracker/KinahLedger.Tracker/KinahLedger.Tracker.csproj)
          [ "$csproj" = "$ver" ] || { echo "::error::tag $tag but the csproj says $csproj"; exit 1; }
          [ -s "release-notes/$tag.md" ] || { echo "::error::release-notes/$tag.md is missing"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Publish the single-file exe
        working-directory: tracker/KinahLedger.Tracker
        run: dotnet publish -c Release -o ../../dist

      # the replay test bank (tracker/tests/replays): saved loot list and crafting panel crops, from players' miscount
      # reports and generated cases, must count as their case says, or nothing is released. Cases that need text
      # recognition are skipped (not failed) on a runner without it; pending cases print without failing.
      - name: Replay tests
        shell: bash
        run: dist/KinahLedger.exe replay-bank tracker/tests/replays | cat

      - name: Sign in to Azure for signing
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign the single-file exe
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # the installed app: normal files with ready-to-run code, so nothing unpacks at every start
      - name: Publish the app as files for the installer
        working-directory: tracker/KinahLedger.Tracker
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=false -p:PublishReadyToRun=true -o ../../build-vpk/publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # the previous release's full package, so this one also ships a small delta for installed trackers
      - name: Fetch the previous release for deltas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" --token "$GH_TOKEN" -o build-vpk/releases || echo "no earlier installer release, so this one ships the full package only"

      - name: Pack the installer
        shell: bash
        env:
          SIGN_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          SIGN_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          SIGN_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          sign=()
          if [ -n "$SIGN_ACCOUNT" ]; then
            printf '{"Endpoint":"%s","CodeSigningAccountName":"%s","CertificateProfileName":"%s"}' "$SIGN_ENDPOINT" "$SIGN_ACCOUNT" "$SIGN_PROFILE" > build-vpk/signing.json
            sign=(--azureTrustedSignFile build-vpk/signing.json)
          fi
          vpk pack -u KinahLedgerTracker -v "$VERSION" -p build-vpk/publish -e KinahLedger.exe \
            --packTitle "Kinah Ledger" --packAuthors "Kinah Ledger" -i tracker/KinahLedger.Tracker/app.ico \
            --shortcuts "Desktop,StartMenuRoot" -o build-vpk/releases "${sign[@]}"
          # installed trackers update only from a release that carries these: never publish one without them
          for f in KinahLedgerTracker-win-Setup.exe releases.win.json "KinahLedgerTracker-$VERSION-full.nupkg"; do
            [ -s "build-vpk/releases/$f" ] || { echo "::error::the installer build is missing $f"; exit 1; }
          done
          cp -f build-vpk/releases/KinahLedgerTracker-win-Setup.exe dist/KinahLedger-Setup.exe

      # the checksum is taken after signing: signing changes the file, and trackers install only an exact match
      - name: Write latest.json and the notes
        shell: bash
        run: |
          node tools/release-manifest.js dist/KinahLedger.exe
          sha=$(node -e "console.log(require('./dist/latest.json').sha256)")
          setup=$(sha256sum dist/KinahLedger-Setup.exe | cut -c1-64)
          # KinahLedger.exe's line comes first: 0.7 trackers take the first sha256 in the notes
          { cat "release-notes/${GITHUB_REF_NAME}.md"; printf '\n\nKinahLedger.exe sha256: %s\nKinahLedger-Setup.exe sha256: %s\n' "$sha" "$setup"; } > dist/notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          pkgs=(build-vpk/releases/*-"$VERSION"-*.nupkg build-vpk/releases/releases.win.json build-vpk/releases/assets.win.json build-vpk/releases/RELEASES)
          gh release create "$GITHUB_REF_NAME" dist/KinahLedger.exe dist/KinahLedger-Setup.exe dist/latest.json "${pkgs[@]}" --title "Kinah Ledger tracker $VERSION" --notes-file dist/notes.md
