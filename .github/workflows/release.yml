# Releases the tracker: push a tag vX.Y.Z and this builds, on a GitHub-hosted runner,
#  - the installer (0.8+): Velopack packs the app as normal files into KinahLedger-Setup.exe plus the full and delta
#    update packages and releases.win.json, which installed trackers update from (Platform/Installer.cs);
#  - KinahLedger.exe, the single-file exe every 0.7 copy updates from, which offers to install itself;
# signs the exe through SignPath (once the SignPath variables and secret below are set), writes latest.json and
# publishes the GitHub release. Nothing else builds or signs a release (CODE_SIGNING_POLICY.md).
#
# Before tagging: bump <Version> in the csproj to X.Y.Z and add release-notes/vX.Y.Z.md. The run stops if either is
# missing, so a stray tag never reaches players.
#
# Signing turns on when the repository has these (Settings › Secrets and variables › Actions):
#   variable SIGNPATH_ORGANIZATION_ID, secret SIGNPATH_API_TOKEN
#   optional variables SIGNPATH_PROJECT_SLUG (default kinah-ledger), SIGNPATH_POLICY_SLUG (default release-signing)
# SignPath asks an approver to approve each request; the run waits up to an hour for that.
name: Release tracker

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check the tag, the version and the notes agree
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"; ver="${tag#v}"
          csproj=$(grep -oP '(?<=<Version>)[^<]+' tracker/KinahLedger.Tracker/KinahLedger.Tracker.csproj)
          [ "$csproj" = "$ver" ] || { echo "::error::tag $tag but the csproj says $csproj"; exit 1; }
          [ -s "release-notes/$tag.md" ] || { echo "::error::release-notes/$tag.md is missing"; exit 1; }
          echo "VERSION=$ver" >> "$GITHUB_ENV"

      - name: Publish the single-file exe
        working-directory: tracker/KinahLedger.Tracker
        run: dotnet publish -c Release -o ../../dist

      # the installed app: normal files with ready-to-run code, so nothing unpacks at every start
      - name: Publish the app as files for the installer
        working-directory: tracker/KinahLedger.Tracker
        run: dotnet publish -c Release -r win-x64 --self-contained -p:PublishSingleFile=false -p:PublishReadyToRun=true -o ../../build-vpk/publish

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161

      # the previous release's full package, so this one also ships a small delta for installed trackers
      - name: Fetch the previous release for deltas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: vpk download github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" --token "$GH_TOKEN" -o build-vpk/releases || echo "no earlier installer release, so this one ships the full package only"

      - name: Pack the installer
        shell: bash
        run: |
          vpk pack -u KinahLedgerTracker -v "$VERSION" -p build-vpk/publish -e KinahLedger.exe \
            --packTitle "Kinah Ledger" --packAuthors "Kinah Ledger" -i tracker/KinahLedger.Tracker/app.ico \
            --shortcuts "Desktop,StartMenuRoot" -o build-vpk/releases
          cp -f build-vpk/releases/KinahLedgerTracker-win-Setup.exe dist/KinahLedger-Setup.exe

      - name: Upload the unsigned exe for signing
        id: unsigned
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: unsigned
          path: dist/KinahLedger.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'kinah-ledger' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use the signed exe
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        shell: bash
        run: cp -f signed/KinahLedger.exe dist/KinahLedger.exe

      # the checksum is taken after signing: signing changes the file, and trackers install only an exact match
      - name: Write latest.json and the notes
        shell: bash
        run: |
          node tools/release-manifest.js dist/KinahLedger.exe
          sha=$(node -e "console.log(require('./dist/latest.json').sha256)")
          setup=$(sha256sum dist/KinahLedger-Setup.exe | cut -c1-64)
          # KinahLedger.exe's line comes first: 0.7 trackers take the first sha256 in the notes
          { cat "release-notes/${GITHUB_REF_NAME}.md"; printf '\n\nKinahLedger.exe sha256: %s\nKinahLedger-Setup.exe sha256: %s\n' "$sha" "$setup"; } > dist/notes.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          pkgs=(build-vpk/releases/*-"$VERSION"-*.nupkg build-vpk/releases/releases.win.json build-vpk/releases/assets.win.json build-vpk/releases/RELEASES)
          gh release create "$GITHUB_REF_NAME" dist/KinahLedger.exe dist/KinahLedger-Setup.exe dist/latest.json "${pkgs[@]}" --title "Kinah Ledger tracker $VERSION" --notes-file dist/notes.md
